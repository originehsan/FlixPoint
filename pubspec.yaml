name: movieticket
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
#
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
#
# In Android, build-name is used as versionName while build-number used as versionCode.
#
# In iOS, build-name is used as CFBundleShortVersionString while build-number
# used as CFBundleVersion.
#
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: '>=3.1.4 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
#
# To automatically upgrade your package dependencies to latest versions:
#
# flutter pub upgrade --major-versions
#
# To see outdated packages:
#
# flutter pub outdated

dependencies:
  flutter:
    sdk: flutter

  # The following adds Cupertino Icons
  # for iOS style icons.
  cupertino_icons: ^1.0.8

  # SVG support
  flutter_svg: ^2.0.10+1

  # Firebase
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_app_check: ^0.4.4+1

  # Image picker
  image_picker: ^1.1.2

  # UUID generation
  uuid: ^4.5.3

  # Fixed newer Flutter compatibility issue
  carousel_slider: ^5.1.2

  # Ratings
  flutter_rating_bar: ^4.0.1

  # Expand/collapse text
  readmore: ^3.0.0

  # Date picker timeline
  date_picker_timeline: ^1.2.7

  # UPI payment
  upi_india: ^3.0.1

  # PDF generation
  pdf: ^3.11.3

  # OTP field
  pinput: ^6.0.2

  # Animation
  animations: ^2.0.11
  lottie: ^3.1.0

  # Local storage
  shared_preferences: ^2.2.3

  # Network connectivity monitoring
  connectivity_plus: ^6.1.1

  # Loading shimmer
  shimmer: ^3.0.0

  # Spacing widget
  gap: ^3.0.1

  # State management
  provider: ^6.1.2

  # File path access
  path_provider: ^2.1.5
  dio: ^5.9.2
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  qr_flutter: ^4.1.0
  share_plus: ^12.0.2
  intl: ^0.20.2
  page_transition: ^2.2.1
  confetti: ^0.8.0
  youtube_player_flutter: ^9.1.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Recommended lints
  flutter_lints: ^6.0.0

# Temporary fixes for dependency conflicts
dependency_overrides:
  archive: ^3.6.1

# For information on generic Dart part:
# https://dart.dev/tools/pub/pubspec

flutter:

  # Ensures Material Icons are available
  uses-material-design: true

  # Assets
  assets:
    - assets/
    - assets/movies_imgaes/

  # Custom fonts
  fonts:
    - family: MyCustomFont
      fonts:
        - asset: assets/font/Antonio/static/Antonio-SemiBold.ttf

# More font examples:
#
# - family: Trajan Pro
#   fonts:
#     - asset: fonts/TrajanPro.ttf
#     - asset: fonts/TrajanPro_Bold.ttf
#       weight: 700
#
# Flutter fonts guide:
# https://flutter.dev/custom-fonts/#from-packages
